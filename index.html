<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/96b2aaa3bb.js"></script>
    <title>Image Slider</title>
  </head>
  <body>
    <header>
      <nav>
        <h1>Han's Gallery</h1>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <div class="title-header">
      <div class="title">
        <h1 class="title-h1">Auto Rotate Image 3D Gallery</h1>
        <p>Created By - <span>Anthony Omeh</span></p>
      </div>
    </div>

    <main class="con">
      <div class="container">
        <button class="buttn"><i class="fa-solid fa-less-than"></i></button>

        <div class="img-container">
          <span style="--i: 1">
            <img src="/image/Image-1.jpg" alt="" />
          </span>
          <span style="--i: 2">
            <img src="/image/Image-2.jpg" alt="" />
          </span>
          <span style="--i: 3">
            <img src="/image/Image-3.jpg" alt="" />
          </span>
          <span style="--i: 4">
            <img src="/image/Image-4.jpg" alt="" />
          </span>
          <span style="--i: 5">
            <img src="/image/Image-5.jpg" alt="" />
          </span>
          <span style="--i: 6">
            <img src="/image/Image-6.jpg" alt="" />
          </span>
          <span style="--i: 7">
            <img src="/image/Image-7.jpg" alt="" />
          </span>
          <span style="--i: 8">
            <img src="/image/Image-8.jpg" alt="" />
          </span>
          <span style="--i: 9">
            <img src="/image/Image-9.jpg" alt="" />
          </span>
          <span style="--i: 10">
            <img src="/image/Image-10.jpg" alt="" />
          </span>
        </div>
       <button class="buttn1"><i class="fa-solid fa-greater-than"></i></button>
      </div>
    </main>

    <!-- Stop Button -->
     <div class="btn-1"><button class="btn1">STOP</button></div>
     <div class="btn-2"><button class="btn2">START</button></div>

    <!-- FOOTER -->
     <footer>
        <div class="footer">
            <p>&copy; Anthony Omeh - 2026. All ight reserved</p>
        </div>
     </footer>
    <script src="script.js"></script>
  </body>
</html>
